<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B站专注模式</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1c1f;
    --card: #24262b;
    --line: rgba(255, 255, 255, .1);
    --text: #e8eaed;
    --dim: #9aa0a8;
    --blue: #00aeec;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 12px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch i {
    position: absolute; inset: 0; border-radius: 12px; background: #41454c;
    transition: background .18s ease; pointer-events: none;
  }
  .switch i::after {
    content: ""; position: absolute; left: 3px; top: 3px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .18s ease;
  }
  .switch input:checked + i { background: var(--blue); }
  .switch input:checked + i::after { transform: translateX(20px); }
  .switch input:focus-visible + i { outline: 2px solid var(--blue); outline-offset: 2px; }

  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 9px; }
  h2 { margin: 0 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .02em; display: flex; justify-content: space-between; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 4px; }
  label.row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 6px; cursor: pointer; user-select: none; }
  label.row:hover { background: rgba(255, 255, 255, .06); }
  label.row input { accent-color: var(--blue); width: 14px; height: 14px; margin: 0; }
  .slider { display: flex; align-items: center; gap: 8px; padding: 4px 4px 0; }
  .slider span { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .slider input { flex: 1; min-width: 0; accent-color: var(--blue); }
  .slider b { width: 34px; text-align: right; font-size: 11px; font-weight: 500; color: var(--dim); }
  .btn {
    width: 100%; height: 30px; margin-top: 6px; border-radius: 7px;
    border: 1px solid var(--line); background: #2c2f36; color: var(--text);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: #363a42; }
  .rules { display: flex; flex-direction: column; gap: 4px; max-height: 110px; overflow: auto; }
  .rule { display: flex; align-items: center; gap: 6px; padding: 3px 5px; border-radius: 6px; background: rgba(255, 255, 255, .05); }
  .rule code {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #b9c0c8;
  }
  .rule button {
    width: 18px; height: 18px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--dim); font-size: 13px; line-height: 1;
  }
  .rule button:hover { background: rgba(255, 80, 80, .2); color: #ff6b6b; }
  .empty { color: #767d86; font-size: 11px; padding: 2px 0; }
  footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; color: #767d86; font-size: 11px; }
  .link { background: transparent; border: 0; padding: 0; color: var(--dim); font: inherit; text-decoration: underline; cursor: pointer; }
  .link:hover { color: var(--text); }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="../icons/icon48.png" alt="">B站专注模式</div>
    <label class="switch" title="总开关">
      <input type="checkbox" id="master">
      <i></i>
    </label>
  </header>

  <section>
    <h2>隐藏内容</h2>
    <div class="grid" id="options"></div>
    <label class="row" style="margin-top:2px;">
      <input type="checkbox" data-key="wide"><span>宽屏播放器</span>
    </label>
  </section>

  <section>
    <h2>悬浮按钮</h2>
    <label class="row">
      <input type="checkbox" id="dockShow"><span>在页面上显示</span>
    </label>
    <div class="slider">
      <span>不透明度</span>
      <input type="range" id="opacity" min="10" max="100" step="1">
      <b id="opacityVal">92%</b>
    </div>
    <button class="btn" id="resetPos" type="button">重置按钮位置</button>
  </section>

  <section>
    <h2>自定义隐藏 <span id="ruleCount"></span></h2>
    <div class="rules" id="rules"></div>
  </section>

  <footer>
    <button class="link" id="resetAll" type="button">恢复默认设置</button>
    <span>Alt + Z 开关</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
